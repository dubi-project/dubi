syntax = "proto3";
package dubi.internal.data.v1;
option go_package = "github.com/dubi-project/dubi/internal/platform/rpc/datawire";

// This is a Node-authenticated development entry, not a tenant-facing API.
message CreateDatasetRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string tenant_id = 4;
  string dataset_id = 5;
}
message CreateDatasetResponse {
  string range_id = 1;
  string owner_group_id = 2;
  uint64 root_index = 3;
}
message PutRecordRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string tenant_id = 4;
  string dataset_id = 5;
  bytes key = 6;
  bytes value = 7;
}
message PutRecordResponse {
  uint64 applied_index = 1;
  string state = 2;
  uint64 confirmation_index = 3;
  uint64 region_generation = 4;
}
message GetRecordRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string tenant_id = 3;
  string dataset_id = 4;
  bytes key = 5;
}
message GetRecordResponse {
  bool found = 1;
  bytes value = 2;
  uint64 confirmed_index = 3;
  string state = 4;
  uint64 region_generation = 5;
}

// RepositoryConfig is a cluster-level backup/recovery destination. The
// credential fields are already encrypted by the recovery platform; plaintext
// access keys and secrets never cross this protocol.
message RepositoryConfig {
  string name = 1;
  string type = 2;
  string path = 3;
  string bucket = 4;
  string prefix = 5;
  string endpoint = 6;
  string region = 7;
  bool path_style = 8;
  bytes encrypted_credentials = 9;
  bytes credentials_nonce = 10;
  string credentials_algorithm = 11;
  uint32 credentials_key_version = 12;
  bool credentials_configured = 13;
}
message CreateRepositoryRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  RepositoryConfig repository = 4;
}
message UpdateRepositoryRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  RepositoryConfig repository = 4;
}
message DeleteRepositoryRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string name = 4;
}
message SetDefaultRepositoryRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string name = 4;
}
message RepositoryMutationResponse {
  RepositoryConfig repository = 1;
  uint64 root_index = 2;
}
message ListRepositoriesRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
}
message ListRepositoriesResponse {
  repeated RepositoryConfig repositories = 1;
  string default_name = 2;
  uint64 root_index = 3;
}

// BackupJob is the engine-neutral, Root-persisted control state for one
// cluster backup. Worker progress contains no Engine or Module data.
message BackupJobWorker {
  uint64 raft_id = 1;
  string node_id = 2;
  string state = 3;
  uint64 lease_epoch = 4;
  int64 lease_expires_unix = 5;
  int64 bytes = 6;
  uint64 objects = 7;
  string error = 8;
  uint64 lease_raft_id = 9;
  string lease_node_id = 10;
}
message BackupJob {
  string job_id = 1;
  string repository = 2;
  string cluster_id = 3;
  uint64 epoch = 4;
  string state = 5;
  uint64 created_index = 6;
  uint64 completed_index = 7;
  string last_error = 8;
  repeated BackupJobWorker workers = 9;
}
message CreateBackupJobRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string job_id = 4;
  string repository = 5;
}
message GetBackupJobRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string job_id = 3;
}
message ListBackupJobsRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
}
message ClaimBackupJobRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string job_id = 4;
  int64 observed_unix = 5;
  int64 lease_expires_unix = 6;
  uint64 worker_raft_id = 7;
  string worker_node_id = 8;
}
message CompleteBackupJobRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string job_id = 4;
  uint64 lease_epoch = 5;
  int64 bytes = 6;
  uint64 objects = 7;
  uint64 worker_raft_id = 8;
  string worker_node_id = 9;
}
message FailBackupJobRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string job_id = 4;
  uint64 lease_epoch = 5;
  string error = 6;
  uint64 worker_raft_id = 7;
  string worker_node_id = 8;
}
message FinalizeBackupJobRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string job_id = 4;
}
message BackupJobResponse {
  BackupJob job = 1;
  uint64 root_index = 2;
}
message ListBackupJobsResponse {
  repeated BackupJob jobs = 1;
  uint64 root_index = 2;
}

message CreateTenantTokenRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string tenant_id = 4;
  uint64 ttl_seconds = 5;
}
message CreateTenantTokenResponse {
  string credential_id = 1;
  string token = 2;
  int64 expires_unix = 3;
}
message RevokeTenantTokenRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string request_id = 3;
  string credential_id = 4;
}
message RevokeTenantTokenResponse { uint64 root_index = 1; }
message AddVolumeRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string path = 3;
}
message AddVolumeResponse {
  string volume_id = 1;
  string path = 2;
  string state = 3;
}
message DrainVolumeRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string volume_id = 3;
}
message DrainVolumeResponse {
  string volume_id = 1;
  string path = 2;
  string state = 3;
}
message RemoveVolumeRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  string volume_id = 3;
}
message RemoveVolumeResponse {
  string volume_id = 1;
  string path = 2;
  string state = 3;
}
message CompactStoreRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
  bool rewrite = 3;
}
message CompactStoreResponse {
  uint64 scanned_packs = 1;
  uint64 removed_packs = 2;
  int64 reclaimed_bytes = 3;
  bool rewritten = 4;
}
message LocalRepairStatusRequest {
  string cluster_id = 1;
  uint64 from_raft_id = 2;
}
message LocalRepairIssue {
  string group_id = 1;
  string error = 2;
}
message LocalRepairStatusResponse {
  bool worker_enabled = 1;
  int64 last_check_unix = 2;
  repeated LocalRepairIssue issues = 3;
  uint32 total_issues = 4;
  VolumeMigrationStatus volume_migration = 5;
  repeated VolumeWriteIssue volume_write_errors = 6;
  ResourceBudgetStatus maintenance_budget = 7;
  uint64 geo_metadata_debt = 8;
  uint64 geo_record_debt = 9;
  string node_id = 10;
  uint64 raft_id = 11;
  ResourceBudgetStatus request_budget = 12;
  repeated VolumeHealthStatus volumes = 13;
}
message VolumeMigrationStatus {
  bool active = 1;
  string source_volume_id = 2;
  string cursor = 3;
  uint64 migrated = 4;
  int64 started_unix = 5;
  string last_error = 6;
}
message VolumeWriteIssue {
  string volume_id = 1;
  string error = 2;
}
message ResourceBudgetStatus {
  uint64 limit_bytes = 1;
  uint64 used_bytes = 2;
  uint64 peak_bytes = 3;
  uint64 rejected = 4;
}
message VolumeHealthStatus {
  string volume_id = 1;
  string state = 2;
  string health = 3;
  string error = 4;
}
service DataService {
  rpc CreateDataset(CreateDatasetRequest) returns (CreateDatasetResponse);
  rpc PutRecord(PutRecordRequest) returns (PutRecordResponse);
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);
  // Cluster-level backup/recovery Repository administration. These methods
  // are Node-authenticated and commit through the Root Group.
  rpc CreateRepository(CreateRepositoryRequest) returns (RepositoryMutationResponse);
  rpc UpdateRepository(UpdateRepositoryRequest) returns (RepositoryMutationResponse);
  rpc DeleteRepository(DeleteRepositoryRequest) returns (RepositoryMutationResponse);
  rpc SetDefaultRepository(SetDefaultRepositoryRequest) returns (RepositoryMutationResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc CreateBackupJob(CreateBackupJobRequest) returns (BackupJobResponse);
  rpc GetBackupJob(GetBackupJobRequest) returns (BackupJobResponse);
  rpc ListBackupJobs(ListBackupJobsRequest) returns (ListBackupJobsResponse);
  rpc ClaimBackupJob(ClaimBackupJobRequest) returns (BackupJobResponse);
  rpc CompleteBackupJob(CompleteBackupJobRequest) returns (BackupJobResponse);
  rpc FailBackupJob(FailBackupJobRequest) returns (BackupJobResponse);
  rpc FinalizeBackupJob(FinalizeBackupJobRequest) returns (BackupJobResponse);
  // Node-authenticated administrative methods, never the Tenant data API.
  rpc CreateTenantToken(CreateTenantTokenRequest) returns (CreateTenantTokenResponse);
  rpc RevokeTenantToken(RevokeTenantTokenRequest) returns (RevokeTenantTokenResponse);
  // Local-Node administrative mutation; the caller and endpoint identities
  // must both match the Store whose path is being registered.
  rpc AddVolume(AddVolumeRequest) returns (AddVolumeResponse);
  // Drain and removal are explicit local-Node administrative mutations. Drain
  // stops new writes but keeps reads; removal rejects any remaining Pack data.
  rpc DrainVolume(DrainVolumeRequest) returns (DrainVolumeResponse);
  rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse);
  // Explicit local maintenance. rewrite=true relocates live records before
  // collecting mixed Packs; both modes are bounded by the request context.
  rpc CompactStore(CompactStoreRequest) returns (CompactStoreResponse);
  // Last observed local repair errors, not a global coverage or durability proof.
  rpc LocalRepairStatus(LocalRepairStatusRequest) returns (LocalRepairStatusResponse);
  // A current Root member may inspect this Node's bounded repair/maintenance
  // state. The response is still local to the serving Node; it is not a
  // cluster-wide durability proof.
  rpc ClusterRepairStatus(LocalRepairStatusRequest) returns (LocalRepairStatusResponse);
}
