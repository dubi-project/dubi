# DUBI local process configuration. Root Group remains authoritative for
# membership and routing; this file does not replace cluster metadata.
version: 1
store_root: /var/lib/dubi
listen: 0.0.0.0:7443
advertise: node-a.example.internal:7443

# When omitted, TLS uses the files atomically created by:
# dubi init --store /var/lib/dubi
# under /var/lib/dubi/dubi-node-pki. Explicit certificate/private_key/ca
# and server_name remain supported only for expert/external-PKI deployments.

# Required when creating a new Root Group. Every initial voter, including this
# node, must appear once. An established node may retain this list as a safe
# address fallback; confirmed Root addresses take precedence.
root_bootstrap:
  - raft_id: 1
    address: node-a.example.internal:7443

tick_interval: 100ms
membership_interval: 1s
max_message_size: 16777216
